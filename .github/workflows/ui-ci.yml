name: UI CI/CD

on:
  push:
    branches: [main]
    paths: ["ui/**"]
  pull_request:
    branches: [main]
    paths: ["ui/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

           # Deploys are done by Vercel's GitHub integration:
      # pushes to main go to production, pull requests get a preview link.