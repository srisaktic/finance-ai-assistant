name: Keep Qdrant Cloud Active

on:
  schedule:
    # Every 3 days at 12:17 UTC
    - cron: "17 12 */3 * *"

  # Allows manual testing
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Check finance filings collection
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 60 \
            "${QDRANT_URL%/}/collections/finance_filings" \
            --header "api-key: ${QDRANT_API_KEY}"

          echo "Qdrant collection contacted successfully."